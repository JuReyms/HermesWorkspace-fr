name: Problème rencontré
description: Signaler une difficulté générique avec le template ou ses guides
title: "[Problème] "
labels: ["bug"]
body:
  - type: dropdown
    id: stage
    attributes:
      label: Étape concernée
      options:
        - Création du workspace
        - Parcours Hello Hermes
        - Première session du résident
        - Organisation ou mémoire
        - Agent invité
        - Git ou GitHub
        - Autre
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Comportement observé
      description: Décrivez le problème sans information privée.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version de HermesWorkspace-fr
      placeholder: v0.1
  - type: checkboxes
    id: privacy
    attributes:
      label: Confidentialité
      options:
        - label: Je n'ai inclus aucun secret, token, détail d'infrastructure ou donnée personnelle.
          required: true
  - type: textarea
    id: authorship
    attributes:
      label: Auteur réel
      description: Si un agent a produit ce signalement, ajoutez sa signature.
